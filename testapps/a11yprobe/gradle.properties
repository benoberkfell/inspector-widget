# A11yProbe — Gradle properties. Mirrors viewspector's root gradle.properties
# (testapps.md §1) so the same JDK-21 / AGP-8.7.2 / Gradle-8.13 toolchain builds it.

# Generous heap; AGP + Kotlin daemon together can spike.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Parallel + caching for a snappy, reproducible build.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# AndroidX is mandatory for AGP 8.x. Jetifier is off.
android.useAndroidX=true
android.enableJetifier=false

# Non-transitive R classes.
android.nonTransitiveRClass=true

# Kotlin official source layout.
kotlin.code.style=official
