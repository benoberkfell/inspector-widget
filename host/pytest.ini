[pytest]
# Inspector Widget (viewspector) host test suite.
# The default run is device-free; the device tests are gated behind the `device`
# marker (and auto-skip when no adb/emulator is present):
#     pytest host/tests -q -m 'not device'   # CI / no-device default
#     pytest host/tests -q -m device         # opt-in: $ANDROID_SERIAL, else emulator-5554
testpaths = tests
markers =
    device: end-to-end test that requires a live adb device/emulator (auto-skips otherwise)
    talkback: turns TalkBack on device-wide (tests/test_device_talkback.py; opt-in via INSPECTOR_WIDGET_TB_DEVICE=<serial>, or =1 for $ANDROID_SERIAL)
