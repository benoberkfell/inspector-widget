[pytest]
# Inspector Widget (viewspector) host test suite.
# The default run is device-free; the one emulator smoke test is gated behind the
# `device` marker (and also auto-skips when no adb/emulator is present):
#     pytest host/tests -q -m 'not device'   # CI / no-device default
#     pytest host/tests -q -m device         # opt-in, requires emulator-5554
testpaths = tests
markers =
    device: end-to-end test that requires a live adb device/emulator (auto-skips otherwise)
