syntax = "proto3";

// ViewSpector — a standalone, agent-driven Android View Layout Inspector.
// Lean re-implementation of the semantics of Android Studio's
// view_layout_inspection.proto (LayoutInspectorViewProtocol), tailored for
// synchronous request/response use over a single framed socket.
//
// String interning: any field documented as a "string-table id" is an int32
// index into Strings.entries (id 0 == empty/absent). This mirrors the real
// inspector's StringEntry mechanism to keep large trees compact.

package viewspector.proto;
option java_package = "com.oberkfell.viewspector.proto";
option java_outer_classname = "ViewInspection";

// ----------------------------------------------------------------- primitives
message Rect { int32 x = 1; int32 y = 2; int32 w = 3; int32 h = 4; }

// Four corners in drawing order, used when a view has a rotation/scale/skew
// transform so the axis-aligned Rect is not enough.
message Quad {
  sint32 x0 = 1; sint32 y0 = 2;
  sint32 x1 = 3; sint32 y1 = 4;
  sint32 x2 = 5; sint32 y2 = 6;
  sint32 x3 = 7; sint32 y3 = 8;
}

message Bounds {
  Rect layout = 1;          // absolute on-screen axis-aligned bounds (px)
  Quad render = 2;          // present only when the view is transformed
}

message StringEntry { int32 id = 1; string str = 2; }
message Strings { repeated StringEntry entries = 1; }

// A resource reference, e.g. @id/foo or @layout/activity_main.
message Resource {
  int32 type = 1;           // string-table id ("id","layout","style",...)
  int32 namespace = 2;      // string-table id (package)
  int32 name = 3;           // string-table id
}

// ----------------------------------------------------------------- properties
message Property {
  enum Type {
    STRING = 0; BOOLEAN = 1; BYTE = 2; CHAR = 3; DOUBLE = 4; FLOAT = 5;
    INT16 = 6; INT32 = 7; INT64 = 8; OBJECT = 9; COLOR = 10; GRAVITY = 11;
    INT_ENUM = 12; INT_FLAG = 13; RESOURCE = 14; DRAWABLE = 15; ANIM = 16;
    ANIMATOR = 17; INTERPOLATOR = 18; DIMENSION = 19;
  }
  int32 name = 1;           // string-table id of the attribute name
  Type type = 2;
  bool is_layout = 3;       // layout-param attribute vs view attribute

  // exactly one value representation is populated, per type
  int32 int32_value = 4;
  int64 int64_value = 5;
  double double_value = 6;
  float float_value = 7;
  int32 str_value = 8;      // string-table id (STRING/OBJECT/INT_ENUM label)
  Resource resource_value = 9;

  // Resolution stack: where this value came from. source = the file/style that
  // set it; resolution_stack = the ordered chain of styles/layouts considered.
  int32 source = 10;                 // string-table id
  repeated int32 resolution_stack = 11; // string-table ids
}

message PropertyGroup {
  int64 view_id = 1;        // uniqueDrawingId of the owning view
  repeated Property properties = 2;
}

// ----------------------------------------------------------------- view tree
message ViewNode {
  int64 id = 1;             // View.uniqueDrawingId (stable per view instance)
  int32 class_name = 2;     // string-table id (simple class name)
  int32 package_name = 3;   // string-table id
  Bounds bounds = 4;
  Resource resource = 5;    // the view's own @id, if any
  Resource layout_resource = 6; // layout file that inflated it, if known
  int32 view_id_name = 7;   // string-table id, e.g. "my_button" (R.id name)
  int32 text_value = 8;     // string-table id; best-effort text for TextViews
  enum Flag { NONE = 0; IS_WEBVIEW = 1; }
  int32 flags = 9;          // bitmask of Flag
  repeated ViewNode children = 10;
}

// ----------------------------------------------------------------- screenshot
message Screenshot {
  enum Format { BITMAP = 0; }    // PNG assembled host-side; SKP is future work
  Format format = 1;
  int32 width = 2;
  int32 height = 3;
  // Raw wire format from the device matches the real inspector:
  // 9-byte header [width LE int32 @0][height LE int32 @4][BitmapType byte @8]
  // followed by raw pixels, the whole buffer Deflate(BEST_SPEED)-compressed.
  // The host inflates and decodes. `type` echoes the BitmapType byte.
  int32 bitmap_type = 4;         // 1=RGB_565, 2=ABGR_8888, 3=ARGB_8888
  bytes data = 5;                // deflated [header+pixels]
  float scale = 6;               // scale applied at capture (<=1.0)
}

// ----------------------------------------------------------------- commands
message HelloCommand {}
message HelloResponse { string agent_version = 1; int32 api_level = 2; string abi = 3; }

message GetWindowsCommand {}
message GetWindowsResponse { repeated int64 root_ids = 1; Strings strings = 2; }

message DumpTreeCommand {
  int64 root_id = 1;             // 0 => all roots
  bool include_properties = 2;   // inline all properties (else use GetProperties)
  bool include_resolution_stack = 3;
  bool include_screenshot = 4;
  float screenshot_scale = 5;    // default 1.0
}
message DumpTreeResponse {
  repeated ViewNode roots = 1;
  Strings strings = 2;
  repeated PropertyGroup properties = 3; // populated iff include_properties
  Screenshot screenshot = 4;             // populated iff include_screenshot
}

message GetPropertiesCommand {
  int64 view_id = 1;
  bool include_resolution_stack = 2;
}
message GetPropertiesResponse { PropertyGroup group = 1; Strings strings = 2; }

message ScreenshotCommand { int64 root_id = 1; float scale = 2; }
message ScreenshotResponse { Screenshot screenshot = 1; }

message ShutdownCommand {}
message ShutdownResponse {}

// Capture a serialized Skia picture (SKP) of a window's rendering commands, for the
// per-view-image path (decoded host-side by the skiaparser gRPC server).
message CaptureSkpCommand { int64 root_id = 1; }   // 0 => first root
message CaptureSkpResponse {
  bool supported = 1;   // false if SKP capture isn't available (e.g. API <= 32)
  bytes skp = 2;        // raw serialized SkPicture ("skiapict" magic + LE version + body)
  int32 version = 3;    // SKP version int (read from the header), 0 if unknown
  string error = 4;
}

// ----------------------------------------------------------------- compose
// A node in the Compose layer (a semantics node and/or a composable from the
// slot table). Bounds are absolute on-screen px (window coords). attrs is a
// generic key/value bag (string-table ids) so it carries both semantics
// properties (Text, Role, ContentDescription, ...) and slot-table info.
message ComposeNode {
  int64 id = 1;             // synthetic stable id (semantics id or anchor hash)
  int32 name = 2;           // string-table id: best label / composable name
  Bounds bounds = 3;        // reuse Bounds (Rect layout + optional Quad)
  message Attr { int32 key = 1; int32 value = 2; } // string-table ids
  repeated Attr attrs = 4;
  int32 source = 5;         // string-table id: "File.kt:123" when known
  enum Kind { COMPOSABLE = 0; SEMANTICS = 1; }
  Kind kind = 6;
  repeated ComposeNode children = 7;
  // RenderNode/layer id of this composable's graphicsLayer, if it has one. This id matches a
  // draw layer in the SKP, so the skiaparser can cut a per-component image for it. 0 = none.
  int64 render_node_id = 8;
}

message DumpComposeCommand {
  int64 root_view_id = 1;   // 0 => every AndroidComposeView
  bool include_semantics = 2;
  bool include_slot_table = 3;
  // If true and the slot table is not populated, enable Compose inspection
  // (set isDebugInspectorInfoEnabled, add slot-table storage, hot-reload to
  // force a fresh composition) before reading. Mirrors the real inspector.
  bool enable_inspection = 4;
}
message DumpComposeResponse {
  message Window { int64 view_id = 1; ComposeNode root = 2; }
  repeated Window windows = 1;
  Strings strings = 2;
  string diagnostics = 3;   // human note: what was/wasn't reachable
}

// ----------------------------------------------------------------- accessibility
// The unified AccessibilityNodeInfo tree as assistive tech (TalkBack/UiAutomator) sees it,
// covering both classic Views and Compose virtual nodes. All *_str-style int fields are
// string-table ids (0 = absent).
message A11yAction { int32 id = 1; int32 label = 2; }  // label = string-table id (custom actions)

message A11yCollectionInfo {
  int32 row_count = 1; int32 column_count = 2; bool hierarchical = 3;
  int32 selection_mode = 4; int32 item_count = 5; int32 important_item_count = 6;
}
message A11yCollectionItemInfo {
  int32 row_index = 1; int32 column_index = 2; int32 row_span = 3; int32 column_span = 4;
  bool heading = 5; bool selected = 6; int32 row_title = 7; int32 column_title = 8;
}
message A11yRangeInfo { int32 type = 1; float min = 2; float max = 3; float current = 4; }
message A11yExtra { int32 key = 1; int32 value = 2; }  // string-table ids

message A11yNode {
  int64 host_view_id = 1;   // uniqueDrawingId of the backing View (ties to ViewNode.id)
  int32 virtual_id = 2;     // -1 (HOST_VIEW_ID) for real views; semantics id for Compose/virtual
  bool is_virtual = 3;
  int32 provider_class = 4; // string id; set on a provider host (AndroidComposeView/WebView)

  Bounds bounds = 5;        // Bounds.layout = boundsInScreen (screen px)

  int32 text = 6; int32 content_description = 7; int32 hint_text = 8;
  int32 state_description = 9; int32 error = 10; int32 tooltip_text = 11;
  int32 pane_title = 12; int32 container_title = 13; int32 supplemental_description = 14;
  int32 role_description = 15;

  int32 class_name = 16; int32 package_name = 17;
  int32 view_id_resource_name = 18; int32 unique_id = 19;

  bool clickable = 20; bool long_clickable = 21; bool context_clickable = 22;
  bool checkable = 23; bool checked = 24; int32 checked_state = 25;
  bool focusable = 26; bool focused = 27; bool accessibility_focused = 28;
  bool selected = 29; bool enabled = 30; bool password = 31; bool scrollable = 32;
  bool visible_to_user = 33; bool heading = 34; bool screen_reader_focusable = 35;
  bool dismissable = 36; bool editable = 37; bool multi_line = 38;
  bool content_invalid = 39; bool showing_hint_text = 40; bool text_entry_key = 41;
  bool text_selectable = 42; bool field_required = 43; bool can_open_popup = 44;
  bool a11y_data_sensitive = 45; bool request_initial_focus = 46;

  int32 important_for_accessibility = 47; // View ints: 0 AUTO,1 YES,2 NO,4 NO_HIDE_DESCENDANTS
  int32 live_region = 48; int32 input_type = 49;
  int32 movement_granularities = 50; int32 max_text_length = 51;
  int32 expanded_state = 52; int32 drawing_order = 53;
  int32 text_selection_start = 54; int32 text_selection_end = 55;

  A11yCollectionInfo collection_info = 56;
  A11yCollectionItemInfo collection_item_info = 57;
  A11yRangeInfo range_info = 58;

  repeated A11yAction actions = 59;
  int32 actions_bitmask = 60;

  int64 traversal_before = 61; int64 traversal_after = 62;
  int64 label_for = 63; int64 labeled_by = 64; repeated int64 labeled_by_list = 65;
  bool is_traversal_group = 66;

  repeated A11yExtra extras = 67;

  int32 layout_size_w = 68; int32 layout_size_h = 69;
  float text_size_px = 70; int32 text_size_unit = 71;

  repeated A11yNode children = 80;
}

message DumpA11yCommand {
  int64 root_id = 1;               // 0 => all roots
  bool include_extras = 2;         // iterate getExtras() (default true)
  bool include_rendering_info = 3; // refreshWithExtraData per node (costly; default false)
}
message DumpA11yResponse {
  message Window {
    int64 root_view_id = 1;
    A11yNode root = 2;
    WindowInfo info = 3;           // the window behind this root (title, type, frame, insets)
  }
  repeated Window windows = 1;
  Strings strings = 2;
  string diagnostics = 3;
}

// ----------------------------------------------------------------- windows
// One WindowInsets type of a window, in px relative to the window (the amounts
// WindowInsets.getInsets(type) reports, not a screen rectangle).
message WindowInsetsInfo {
  int32 left = 1; int32 top = 2; int32 right = 3; int32 bottom = 4;
  bool visible = 5;                // WindowInsets.isVisible(type)
}

// Metadata of the window behind one root View: what an accessibility service sees as the
// window (title, type, frame) plus the system-bar / IME insets. Shared by every response
// that describes windows (DumpA11y today; capture and render windows reuse it).
message WindowInfo {
  int64 root_view_id = 1;          // uniqueDrawingId of the window's root View
  // string-table id: the title accessibility services see for the window
  // (AccessibilityWindowInfo.getTitle; LayoutParams.accessibilityTitle, which
  // Activity.setTitle / Dialog.setTitle set). 0 = untitled.
  int32 title = 2;
  // string-table id: LayoutParams.getTitle(), the window manager's tag
  // (e.g. "com.example/com.example.MainActivity", "PopupWindow:1a2b3c").
  int32 layout_title = 3;
  int32 window_type = 4;           // WindowManager.LayoutParams.type
  int32 wm_flags = 5;              // WindowManager.LayoutParams.flags
  Bounds frame = 6;                // the window on screen (screen px)
  int32 z = 7;                     // stacking position among this app's windows, 0 = bottom
  bool has_window_focus = 8;       // View.hasWindowFocus() on the root (the active window)
  int32 display_id = 9;
  WindowInsetsInfo status_bars = 10;      // API 30+
  WindowInsetsInfo navigation_bars = 11;  // API 30+
  WindowInsetsInfo ime = 12;              // API 30+
  WindowInsetsInfo display_cutout = 13;   // API 30+
}

// ----------------------------------------------------------------- accessibility focus + events
// Where accessibility (or input) focus is, read from the app's own windows.
message A11yFocus {
  int64 root_view_id = 1;          // the window root whose ViewRootImpl holds the focus
  int64 host_view_id = 2;          // host-key contract (CONTRACT.md §9): the node's own View
  int32 virtual_id = 3;            // -1 for a real View, else the virtual (Compose semantics) id
  Bounds bounds = 4;               // screen px
  A11yNode node = 5;               // the focused node, children to subtree_depth levels
  // The window still records focus on a node that no longer resolves (a virtual node the
  // provider no longer serves, or a detached / hidden View): what TalkBack clears next.
  bool stale = 6;
  WindowInfo window = 7;
  string source = 8;               // how it was read: "view-root", "find-focus", "input-focus"
  // string-table id: class name of the View behind host_view_id (e.g.
  // androidx.compose.ui.platform.AndroidComposeView for a Compose node).
  int32 host_class = 9;
}

// One accessibility event the app sent, as recorded by the agent's event tap (a forwarding
// AccessibilityDelegate on each window root). String fields are string-table ids.
message A11yEventRecord {
  int64 seq = 1;                   // monotonic per agent, from 1
  int64 uptime_ms = 2;             // SystemClock.uptimeMillis() when the tap saw it
  int32 type = 3;                  // AccessibilityEvent.getEventType()
  int64 root_view_id = 4;          // the window root whose tap saw it
  int64 host_view_id = 5;          // source node, host-key contract (0 = unresolved)
  int32 virtual_id = 6;
  int32 content_change_types = 7;
  int32 scroll_delta_x = 8; int32 scroll_delta_y = 9;
  int32 from_index = 10; int32 to_index = 11; int32 item_count = 12;
  int32 scroll_x = 13; int32 scroll_y = 14; int32 max_scroll_x = 15; int32 max_scroll_y = 16;
  int32 text = 17;                 // the event text (or content description), <= 80 chars
  int32 pane_title = 18;           // pane changes (WINDOW_STATE_CHANGED + PANE_*): the pane title
  int32 class_name = 19;
  int32 action = 20;               // AccessibilityEvent.getAction()
  int32 host_class = 21;           // class name of the source's View (see A11yFocus.host_class)
}

message A11yFocusCommand {
  // Long-poll (wait_ms > 0): return once a TYPE_VIEW_ACCESSIBILITY_FOCUSED event with
  // seq > after_seq was recorded and then quiet_ms passed with no event, or when wait_ms
  // runs out. wait_ms 0 reads at once.
  int64 after_seq = 1;
  int32 wait_ms = 2;
  int32 quiet_ms = 3;
  bool include_input_focus = 4;
  int32 subtree_depth = 5;         // 0 = the focused node alone
  int32 max_events = 6;            // newest N events after after_seq; 0 = all still buffered
}
message A11yFocusResponse {
  A11yFocus a11y = 1;              // unset = no accessibility focus in this app's windows
  A11yFocus input = 2;             // unset = not requested, or no input focus
  repeated A11yEventRecord events = 3;  // seq > after_seq, oldest first
  int64 seq = 4;                   // newest recorded seq: the next call's after_seq
  Strings strings = 5;
  string diagnostics = 6;
  bool focus_event = 7;            // the wait saw accessibility focus move (event or poll)
  bool timed_out = 8;              // wait_ms ran out first
  int32 waited_ms = 9;
  int32 read_us = 10;              // main-thread time of the focus read
  int64 dropped = 11;              // events after after_seq that fell out of the buffer
  bool touch_exploration = 12;     // AccessibilityManager.isTouchExplorationEnabled()
  bool services_enabled = 13;      // an accessibility service is enabled
}

// An action on one node, shared by every command that acts on the UI. Values map to
// AccessibilityNodeInfo actions; RAW carries any action id (custom actions included).
enum NodeAction {
  NODE_ACTION_UNSPECIFIED = 0;
  NODE_ACTION_ACCESSIBILITY_FOCUS = 1;
  NODE_ACTION_CLEAR_ACCESSIBILITY_FOCUS = 2;
  NODE_ACTION_CLICK = 3;
  NODE_ACTION_LONG_CLICK = 4;
  NODE_ACTION_SCROLL_FORWARD = 5;
  NODE_ACTION_SCROLL_BACKWARD = 6;
  NODE_ACTION_SHOW_ON_SCREEN = 7;
  NODE_ACTION_FOCUS = 8;
  NODE_ACTION_CLEAR_FOCUS = 9;
  NODE_ACTION_SET_TEXT = 10;
  NODE_ACTION_EXPAND = 11;
  NODE_ACTION_COLLAPSE = 12;
  NODE_ACTION_DISMISS = 13;
  NODE_ACTION_RAW = 100;
}

// One action argument (an AccessibilityNodeInfo ACTION_ARGUMENT_* Bundle entry).
message ActionArg {
  string key = 1;
  oneof value {
    string string_value = 2;
    int32 int_value = 3;
    bool bool_value = 4;
    float float_value = 5;
  }
}

message A11yActCommand {
  int64 host_view_id = 1;          // host-key contract: the node's own View
  int32 virtual_id = 2;            // -1 = the View itself (send it explicitly: 0 is a valid id)
  NodeAction action = 3;
  int32 raw_action_id = 4;         // with NODE_ACTION_RAW
  repeated ActionArg args = 5;
  int32 subtree_depth = 6;         // for the A11yFocus read afterwards
}
message A11yActResponse {
  bool performed = 1;              // the node accepted the action
  A11yFocus after = 2;             // accessibility focus right after the action
  string error = 3;                // why it was refused / not attempted
  Strings strings = 4;
  int64 seq_before = 5;            // event-tap seq just before the action (long-poll from here)
  int64 seq = 6;                   // event-tap seq after it
  string diagnostics = 7;
  int32 action_id = 8;             // the AccessibilityNodeInfo action id attempted
}

// ----------------------------------------------------------------- envelopes
message Request {
  int32 id = 1;             // monotonic, echoed in Response.id
  oneof command {
    HelloCommand hello = 2;
    GetWindowsCommand get_windows = 3;
    DumpTreeCommand dump_tree = 4;
    GetPropertiesCommand get_properties = 5;
    ScreenshotCommand screenshot = 6;
    ShutdownCommand shutdown = 7;
    DumpComposeCommand dump_compose = 8;
    CaptureSkpCommand capture_skp = 9;
    DumpA11yCommand dump_a11y = 10;
    A11yFocusCommand a11y_focus = 20;
    A11yActCommand a11y_act = 21;
  }
}

message Response {
  int32 id = 1;
  enum Status { OK = 0; ERROR = 1; }
  Status status = 2;
  string error = 3;
  oneof payload {
    HelloResponse hello = 4;
    GetWindowsResponse get_windows = 5;
    DumpTreeResponse dump_tree = 6;
    GetPropertiesResponse get_properties = 7;
    ScreenshotResponse screenshot = 8;
    ShutdownResponse shutdown = 9;
    DumpComposeResponse dump_compose = 10;
    CaptureSkpResponse capture_skp = 11;
    DumpA11yResponse dump_a11y = 12;
    A11yFocusResponse a11y_focus = 20;
    A11yActResponse a11y_act = 21;
  }
}
