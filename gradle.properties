# ViewSpector — global Gradle properties.

# Generous heap; AGP + protobuf codegen + kotlin daemon together can spike.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Parallel + caching for a snappy, reproducible build.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# AndroidX is mandatory for AGP 8.x. Jetifier is off — we pull no legacy support libs.
android.useAndroidX=true
android.enableJetifier=false

# Non-transitive R classes keep the (component-less) agent APK lean.
android.nonTransitiveRClass=true

# Kotlin code style + official source layout.
kotlin.code.style=official
